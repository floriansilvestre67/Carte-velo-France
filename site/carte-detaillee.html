<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte – Carte Vélo France</title>
  <meta name="robots" content="noindex">
  <script>
    /* L'ancienne « carte détaillée » est réunie avec la carte : son détail s'ouvre avec « Plus de détails ».
       Les liens partagés gardent leur ville ou leur département. */
    (function () {
      var h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
      var ville = q.get("ville"), dep = h.get("dep") || q.get("dep");
      location.replace("carte.html" + (ville ? "?ville=" + encodeURIComponent(ville)
                                              : dep ? "?dep=" + encodeURIComponent(dep) : ""));
    })();
  </script>
</head>
<body>
  <p><a href="carte.html">Ouvrir la carte</a></p>
</body>
</html>
