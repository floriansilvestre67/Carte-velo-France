<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte – Carte Vélo France</title>
  <meta name="description" content="Où fait-il bon pédaler en France ? Score vélo des départements et des villes, aménagements cyclables et vélos en libre-service.">
  <script>
    /* Anciens liens partagés : une adresse avec des réglages de la carte détaillée (indicateur, région,
       département, arrondissement) ouvre la carte détaillée, comme avant. */
    (function () {
      var h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
      if (h.has("ind") || h.has("reg") || h.has("dep") || q.has("arr")) {
        location.replace("carte-detaillee.html" + location.search + location.hash);
      }
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%230e7c5a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/accueil.css">
</head>
<body class="page-accueil">
  <a class="lien-evitement" href="#recherche-ville">Aller à la recherche</a>

  <header class="bandeau bandeau-accueil">
    <a class="marque" href="./"><span class="pastille" aria-hidden="true"></span>Carte Vélo France</a>
    <nav aria-label="Navigation principale">
      <a href="carte.html" aria-current="page">Carte</a>
      <a href="carte-detaillee.html" id="lien-detail-nav">Carte détaillée</a>
      <a href="statistiques.html">Statistiques</a>
      <a href="methode.html">Sources et méthode</a>
    </nav>
  </header>

  <main class="accueil">
    <h1 class="visuellement-cache">Score vélo des départements et des villes</h1>
    <div id="carte" role="region" aria-label="Carte des départements, colorés selon le score vélo"></div>

    <div class="recherche-flottante champ-ville">
      <label class="visuellement-cache" for="recherche-ville">Rechercher une ville</label>
      <svg class="loupe" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
      <input type="search" id="recherche-ville" placeholder="Rechercher une ville" spellcheck="false" autocomplete="off">
      <ul id="suggestions-ville" class="suggestions" hidden></ul>
    </div>

    <section class="fiche-courte" id="fiche-courte" hidden aria-live="polite" tabindex="-1"></section>

    <div class="legende-simple" id="legende-simple" aria-live="polite">
      <p class="legende-titre">Score vélo</p>
      <div class="legende-bande" id="legende-bande" aria-hidden="true"></div>
      <div class="legende-valeurs"><span>moins</span><span>plus</span></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="js/ville.js"></script>
  <script src="js/commun.js"></script>
  <script src="js/accueil.js"></script>
</body>
</html>
