# Génère les données puis publie le site sur GitHub Pages.
# Se lance : à chaque push sur main, chaque jour à 6 h 17 (heure de Paris en été), et à la demande
# (onglet Actions > « Données et déploiement » > Run workflow).
name: Données et déploiement

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"   # en UTC
  workflow_dispatch:
    inputs:
      forcer_poi:
        description: "Recalculer les points d'intérêt sans attendre la semaine suivante"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Lancer les tests
        run: python -m pytest -q tests

      - name: Télécharger les sources et calculer les indicateurs
        env:
          # Site déjà en ligne : sert de secours si une source est en panne aujourd'hui.
          SITE_PRECEDENT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FORCER_POI: ${{ inputs.forcer_poi && '1' || '' }}
        run: python scripts/construire_donnees.py --sortie site/data

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
